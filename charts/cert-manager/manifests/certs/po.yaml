---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: po
  namespace: cert-manager
spec:
  isCA: false
  usages:
    - client auth
    - server auth
  commonName: po.breeze-blocks.net
  secretName: po-admission
  dnsNames:
    - po.breeze-blocks.net
  ipAddresses:
    - 192.168.5.42
    - 192.168.5.226
  emailAddresses:
    - po@breeze-blocks.net
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    name: comms-svc-int
    kind: ClusterIssuer
    group: cert-manager.io
