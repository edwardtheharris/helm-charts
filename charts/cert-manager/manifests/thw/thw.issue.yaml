apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: thw-svc-int
  namespace: cert-manager
spec:
  ca:
    secretName: thw-svc-ca-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thw-svc-int
  namespace: cert-manager
spec:
  isCA: true
  commonName: int.the-hard-way.gov
  secretName: thw-svc-int-tls
  dnsNames:
    - int.the-hard-way.gov
  emailAddresses:
    - int@breeze-blocks.net
  ipAddresses:
    - 192.168.5.39
    - 192.168.5.41
    - 192.168.5.43
    - 192.168.5.45
    - 192.168.5.47
    - 192.168.5.49
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    name: thw-svc-int
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - cert sign
    - client auth
    - digital signature
    - server auth
    - signing
