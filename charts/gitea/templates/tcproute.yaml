apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  annotations:
    meta.helm.sh/release-name: gitea
    meta.helm.sh/release-namespace: gitea
  labels:
    app.kubernetes.io/managed-by: Helm
  name: gitea
  namespace: gitea
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gitea
    sectionName: gitea-ssh
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: gitea-ssh
      port: 22
      weight: 1
